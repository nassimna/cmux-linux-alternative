appId: dev.agentworkspace.desktop
productName: Ternline
asar: true
afterPack: ./scripts/after-pack.mjs
directories:
  output: ../../release
files:
  - out/**/*
  - package.json
extraResources:
  - from: node_modules/@fontsource-variable/jetbrains-mono/LICENSE
    to: licenses/JetBrainsMono-OFL-1.1.txt
linux:
  extraResources:
    - from: ../../target/node-linux
      to: node-linux
      filter:
        - '**/*'
  icon: build/icons
  electronUpdaterCompatibility: '>= 2.16'
  category: Development
  executableName: agent-workspace
  artifactName: agent-workspace-${version}-x86_64.${ext}
  maintainer: Ternline contributors
  vendor: Ternline contributors
  synopsis: Terminal workspace for local and remote development
  syncDesktopName: true
  desktop:
    entry:
      StartupWMClass: agent-workspace
  target:
    - AppImage
    - deb
    - rpm
rpm:
  packageName: agent-workspace
  depends:
    - bubblewrap
    - systemd
deb:
  packageName: agent-workspace
  depends:
    - bubblewrap
    - systemd
mac:
  icon: build/icon.svg
  electronUpdaterCompatibility: '>= 2.16'
  category: public.app-category.developer-tools
  artifactName: agent-workspace-${version}-macos-${arch}.${ext}
  hardenedRuntime: true
  notarize: true
  target:
    - dmg
    - zip
win:
  icon: build/icon.svg
  electronUpdaterCompatibility: '>= 2.16'
  executableName: agent-workspace
  artifactName: agent-workspace-${version}-windows-${arch}-setup.${ext}
  verifyUpdateCodeSignature: true
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  uninstallDisplayName: Ternline
