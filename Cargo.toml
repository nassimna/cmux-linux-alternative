[workspace]
resolver = "3"
members = [
  "crates/agent-adapter",
  "crates/agent-session-runtime",
  "crates/action-runtime",
  "crates/cli",
  "crates/config",
  "crates/control-server",
  "crates/core",
  "crates/diagnostics",
  "crates/notification-runtime",
  "crates/process-containment",
  "crates/protocol",
  "crates/service",
  "crates/storage",
  "crates/terminal-runtime",
  "crates/workspace-runtime",
  "crates/workspace-content",
  "crates/content-index",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.96"

[workspace.dependencies]
agent-workspace-agent-adapter = { path = "crates/agent-adapter" }
agent-workspace-agent-session-runtime = { path = "crates/agent-session-runtime" }
agent-workspace-action-runtime = { path = "crates/action-runtime" }
agent-workspace-config = { path = "crates/config" }
agent-workspace-control-server = { path = "crates/control-server" }
agent-workspace-core = { path = "crates/core" }
agent-workspace-diagnostics = { path = "crates/diagnostics" }
agent-workspace-notification-runtime = { path = "crates/notification-runtime" }
agent-workspace-process-containment = { path = "crates/process-containment" }
agent-workspace-protocol = { path = "crates/protocol" }
agent-workspace-storage = { path = "crates/storage" }
agent-workspace-terminal-runtime = { path = "crates/terminal-runtime" }
agent-workspace-content = { path = "crates/workspace-content" }
agent-workspace-content-index = { path = "crates/content-index" }
agent-workspace-runtime = { path = "crates/workspace-runtime" }
async-trait = "0.1.89"
base64 = "0.22.1"
blake3 = "1.8.2"
chacha20poly1305 = "0.10.1"
clap = { version = "4.5.54", features = ["derive"] }
interprocess = { version = "2.4.2", features = ["tokio"] }
listeners = "0.6.0"
filetime = "0.2.26"
libc = "0.2.180"
portable-pty = "0.9.0"
proptest = "1.9.0"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
secret-service = { version = "5.1.0", default-features = false, features = ["rt-tokio-crypto-rust"] }
getrandom = "0.2.17"
signature = "2.2.0"
ssh-agent-lib = "0.6.0"
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ed25519"] }
subtle = "2.6.1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tempfile = "3.23.0"
thiserror = "2.0.17"
toml_edit = "0.24.0"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
ts-rs = { version = "12.0.1", features = ["serde-compat", "serde-json-impl"] }
uzers = "0.12.2"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
zeroize = "1.9.0"
url = "2.5.7"
widestring = "1.2.1"
which = "8.0.5"

[profile.release]
lto = "thin"
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
