name: Performance qualification

on:
  schedule:
    - cron: '7 2 * * *'
  workflow_dispatch:
    inputs:
      run_full_soak:
        description: Run the exact eight-hour soak instead of smoke
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Release-build performance smoke
    if: github.event_name == 'schedule' || inputs.run_full_soak != true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 10.34.5
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: pnpm
      - name: Install Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run smoke, comparing only an approved checked-in baseline
        env:
          BASELINE: apps/desktop/scripts/performance/approved-baseline.json
        run: |
          mkdir -p performance-evidence
          if [[ -f "$BASELINE" ]]; then
            xvfb-run -a pnpm --filter @agent-workspace/desktop performance:smoke -- --output "$GITHUB_WORKSPACE/performance-evidence/smoke.json" --baseline "$GITHUB_WORKSPACE/$BASELINE"
          else
            echo 'No maintainer-approved baseline is checked in; running gates without claiming a comparison.' | tee performance-evidence/NO_APPROVED_BASELINE.txt
            xvfb-run -a pnpm --filter @agent-workspace/desktop performance:smoke -- --output "$GITHUB_WORKSPACE/performance-evidence/smoke.json"
          fi
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-smoke
          path: performance-evidence
          if-no-files-found: warn
          retention-days: 30

  soak:
    name: Explicit eight-hour soak
    if: github.event_name == 'workflow_dispatch' && inputs.run_full_soak == true
    runs-on: ubuntu-latest
    timeout-minutes: 540
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 10.34.5
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: pnpm
      - name: Install Rust toolchain and dependencies
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          pnpm install --frozen-lockfile
      - name: Run the hard-coded eight-hour soak
        run: |
          mkdir -p performance-evidence
          xvfb-run -a pnpm --filter @agent-workspace/desktop performance:soak -- --output "$GITHUB_WORKSPACE/performance-evidence/soak.json"
      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-soak
          path: performance-evidence
          if-no-files-found: warn
          retention-days: 90
