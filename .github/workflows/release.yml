name: Release (downloadable packages)

# Builds unsigned Linux x64 Node packages, then publishes a GitHub Release.
#
# Trigger either by:
#   - pushing a tag like v0.1.0, or
#   - running this workflow manually (Actions tab) with a tag input.
#
# The builds are unsigned. Publication remains a maintainer-triggered release action.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (e.g. v0.1.0)
        required: true
        type: string
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  PNPM_VERSION: 10.34.5
  NODE_VERSION: 22.22.3

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install rpm tooling (Linux rpm target)
        if: matrix.label == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage Node service and CLI
        run: pnpm stage:node:linux

      - name: Build renderer bundle
        run: pnpm --filter @agent-workspace/desktop exec electron-vite build

      - name: Package Linux (AppImage, deb, rpm)
        if: matrix.label == 'linux-x64'
        run: >-
          pnpm --filter @agent-workspace/desktop exec electron-builder
          --linux AppImage deb rpm --x64 --publish never

      - name: Inspect packaged Node runtime
        run: |
          version=$(node -p "require('./package.json').version")
          for type in AppImage deb rpm; do
            scripts/release/inspect-node-preview.sh "release/agent-workspace-${version}-x86_64.${type}" "$type"
          done

      - name: Collect installable artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          shopt -s nullglob
          for f in \
            release/*.AppImage \
            release/*.deb \
            release/*.rpm; do
            cp "$f" dist-artifacts/
          done
          echo "Collected:"; ls -la dist-artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-${{ matrix.label }}
          path: dist-artifacts/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: meta
        run: |
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ github.event.inputs.prerelease }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: package-*
          path: staged
          merge-multiple: true

      - name: Generate checksums
        working-directory: staged
        run: |
          ls -la
          sha256sum * > SHA256SUMS
          echo "----- SHA256SUMS -----"; cat SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          notes=$(cat <<'EOF'
          Downloadable desktop packages for **Agent Workspace**.

          | Platform | File |
          | --- | --- |
          | Linux (AppImage) | `agent-workspace-*-x86_64.AppImage` |
          | Linux (Debian/Ubuntu) | `agent-workspace-*-x86_64.deb` |
          | Linux (Fedora/RHEL) | `agent-workspace-*-x86_64.rpm` |

          Verify downloads against `SHA256SUMS`.

          > **Note:** These Linux builds are **unsigned**.
          EOF
          )
          prerelease_flag=()
          if [[ "$PRERELEASE" == "true" ]]; then prerelease_flag+=(--prerelease); fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" staged/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" staged/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Agent Workspace ${TAG}" \
              --notes "$notes" \
              "${prerelease_flag[@]}"
          fi
