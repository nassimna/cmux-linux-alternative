name: Signed native release candidates

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel to package
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
      update_base_url:
        description: HTTPS directory where this channel's artifacts will be published
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-release-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  macos-signed:
    name: Signed and notarized macOS candidate
    runs-on: macos-14
    environment: native-release
    timeout-minutes: 60
    env:
      AGENT_WORKSPACE_FORCE_CODE_SIGNING: 'true'
      AGENT_WORKSPACE_UPDATE_BUILD_CHANNEL: ${{ inputs.channel }}
      AGENT_WORKSPACE_UPDATE_BUILD_URL: ${{ inputs.update_base_url }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
      CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Install dependencies and build signed updater package
        run: |
          pnpm install --frozen-lockfile
          pnpm package:mac:updates

      - name: Verify signature, notarization, and packaged readiness
        run: |
          scratch=$(mktemp -d)
          mount="$scratch/mount"
          app="$scratch/Agent Workspace.app"
          mkdir -p "$mount"
          dmg=$(find release -maxdepth 1 -name 'agent-workspace-*-macos-x64.dmg' -print -quit)
          test -n "$dmg"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          trap 'hdiutil detach "$mount" >/dev/null 2>&1 || true; rm -rf "$scratch"' EXIT
          ditto "$mount/Agent Workspace.app" "$app"
          hdiutil detach "$mount"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          scripts/release/launch-probe-macos.sh "$app/Contents/MacOS/Agent Workspace"

      - name: Upload signed macOS candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ inputs.channel }}-signed
          path: |
            release/*.dmg
            release/*.zip
            release/*-mac.yml
          if-no-files-found: error

  windows-signed:
    name: Signed Windows candidate
    runs-on: windows-latest
    environment: native-release
    timeout-minutes: 60
    env:
      AGENT_WORKSPACE_FORCE_CODE_SIGNING: 'true'
      AGENT_WORKSPACE_UPDATE_BUILD_CHANNEL: ${{ inputs.channel }}
      AGENT_WORKSPACE_UPDATE_BUILD_URL: ${{ inputs.update_base_url }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Install dependencies and build signed updater package
        run: |
          pnpm install --frozen-lockfile
          pnpm package:windows:updates

      - name: Verify signature, install, and packaged readiness
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter 'agent-workspace-*-windows-x64-setup.exe' |
            Select-Object -First 1
          if ($null -eq $installer) { throw 'Windows installer was not generated.' }
          $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
          if ($signature.Status -ne 'Valid') {
            throw "Installer signature is $($signature.Status): $($signature.StatusMessage)"
          }
          $installRoot = Join-Path $env:RUNNER_TEMP 'agent-workspace-signed'
          $result = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installRoot") `
            -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "NSIS installer failed with code $($result.ExitCode)." }
          scripts/release/launch-probe.ps1 (Join-Path $installRoot 'agent-workspace.exe')

      - name: Upload signed Windows candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-${{ inputs.channel }}-signed
          path: |
            release/*-setup.exe
            release/*.yml
          if-no-files-found: error
