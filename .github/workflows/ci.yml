name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node and Linux desktop quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate

  linux-package:
    name: Packaged Node runtime
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm cpio
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:linux
      - name: Inspect each exact artifact
        run: |
          version=$(node -p "require('./package.json').version")
          for type in AppImage deb rpm; do
            artifact="release/agent-workspace-${version}-x86_64.${type}"
            scripts/release/inspect-node-preview.sh "$artifact" "$type"
          done
