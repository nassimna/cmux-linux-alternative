name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and Linux build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated protocol bindings
        run: |
          pnpm generate:protocol
          git diff --exit-code -- packages/protocol-client/src/generated

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build production desktop bundles
        run: pnpm build

  linux-electron-smoke:
    name: Packaged Linux Electron smoke (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and launch the packaged application under Xvfb
        run: >-
          xvfb-run -a pnpm --filter @agent-workspace/desktop exec playwright test
          e2e/packaged-launch.spec.mjs --workers=1 --timeout=30000

  full-e2e:
    name: Full Electron E2E (main)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Install dependencies and build sidecars
        run: |
          pnpm install --frozen-lockfile
          pnpm build:service:debug

      - name: Run complete Electron suite under Xvfb
        run: xvfb-run -a pnpm --filter @agent-workspace/desktop test:e2e

  macos-native:
    name: macOS native E2E and package
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Test native Rust and desktop layers
        run: |
          cargo test --workspace --all-features
          pnpm --filter @agent-workspace/desktop typecheck
          pnpm --filter @agent-workspace/desktop test

      - name: Run complete Electron suite
        run: pnpm --filter @agent-workspace/desktop test:e2e

      - name: Build unsigned macOS update package for smoke validation
        env:
          AGENT_WORKSPACE_UPDATE_BUILD_CHANNEL: stable
          AGENT_WORKSPACE_UPDATE_BUILD_URL: https://updates.example.invalid/desktop/stable/
        run: |
          pnpm build:service
          pnpm --filter @agent-workspace/desktop exec electron-vite build
          pnpm --filter @agent-workspace/desktop exec electron-builder --mac dmg zip --x64 --publish never \
            -c.mac.identity=null -c.mac.hardenedRuntime=false -c.mac.notarize=false \
            -c.publish.provider=generic \
            -c.publish.url="$AGENT_WORKSPACE_UPDATE_BUILD_URL" \
            -c.publish.channel="$AGENT_WORKSPACE_UPDATE_BUILD_CHANNEL" \
            -c.publish.publishAutoUpdate=true

      - name: Install from DMG and verify packaged process readiness
        run: |
          scratch=$(mktemp -d)
          mount="$scratch/mount"
          installed="$scratch/Agent Workspace.app"
          mkdir -p "$mount"
          dmg=$(find release -maxdepth 1 -name 'agent-workspace-*-macos-x64.dmg' -print -quit)
          test -n "$dmg"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          trap 'hdiutil detach "$mount" >/dev/null 2>&1 || true; rm -rf "$scratch"' EXIT
          ditto "$mount/Agent Workspace.app" "$installed"
          hdiutil detach "$mount"
          scripts/release/launch-probe-macos.sh "$installed/Contents/MacOS/Agent Workspace"

      - name: Upload macOS smoke artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-native-smoke
          path: |
            release/*.dmg
            release/*.zip
            release/*-mac.yml
          if-no-files-found: error

  windows-native:
    name: Windows native E2E and package
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Install SQLite CLI
        shell: pwsh
        run: choco install sqlite --yes --no-progress

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Test native Rust and desktop layers
        run: |
          cargo test --workspace --all-features
          pnpm --filter @agent-workspace/desktop typecheck
          pnpm --filter @agent-workspace/desktop test

      - name: Run complete Electron suite
        run: pnpm --filter @agent-workspace/desktop test:e2e

      - name: Build unsigned Windows update package for smoke validation
        shell: pwsh
        env:
          AGENT_WORKSPACE_UPDATE_BUILD_CHANNEL: stable
          AGENT_WORKSPACE_UPDATE_BUILD_URL: https://updates.example.invalid/desktop/stable/
        run: |
          pnpm build:service
          pnpm --filter @agent-workspace/desktop exec electron-vite build
          pnpm --filter @agent-workspace/desktop exec electron-builder --win nsis --x64 --publish never `
            -c.publish.provider=generic `
            "-c.publish.url=$env:AGENT_WORKSPACE_UPDATE_BUILD_URL" `
            "-c.publish.channel=$env:AGENT_WORKSPACE_UPDATE_BUILD_CHANNEL" `
            -c.publish.publishAutoUpdate=true

      - name: Install NSIS package and verify packaged process readiness
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter 'agent-workspace-*-windows-x64-setup.exe' |
            Select-Object -First 1
          if ($null -eq $installer) { throw 'Windows installer was not generated.' }
          $installRoot = Join-Path $env:RUNNER_TEMP 'agent-workspace-installed'
          $result = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installRoot") `
            -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "NSIS installer failed with code $($result.ExitCode)." }
          scripts/release/launch-probe.ps1 (Join-Path $installRoot 'agent-workspace.exe')
          $uninstaller = Get-ChildItem $installRoot -Filter 'Uninstall*.exe' | Select-Object -First 1
          if ($null -ne $uninstaller) {
            Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait
          }

      - name: Upload Windows smoke artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-native-smoke
          path: |
            release/*-setup.exe
            release/*.yml
          if-no-files-found: error
