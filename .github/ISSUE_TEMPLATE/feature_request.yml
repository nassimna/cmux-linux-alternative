name: Feature request
description: Propose a focused improvement
labels: [needs design]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or user need is not served today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
